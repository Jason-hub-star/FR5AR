<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WebXR — 배치안을 바닥에 얹는다</title>
  <link rel="stylesheet" href="/src/screens/xr.css">
</head>
<body>
  <div id="panel">
    <h2>배치안을 바닥에 얹는다</h2>
    <p id="sup">확인 중…</p>
    <label>배치안 <select id="preset"></select></label>
    <!-- **두 모드는 배율 숫자 하나만 다르다.** 렌더 경로를 가르면 평소 테스트가
         촬영본을 검증해 주지 못하고, 정작 촬영 날 갈라진 쪽이 깨진다 (D17 의 실패 모양). -->
    <label>모드
      <select id="mode">
        <option value="fit">평소 — 2.5m 로 줄여서 (아무 바닥)</option>
        <option value="real">촬영 — 실물 1:1 (맵 두 모서리 탭)</option>
      </select>
    </label>
    <!-- **팔은 단계적으로 켠다.** 삼각형 128,808 × 2 의 폰 성능이 미측정이라
         (GAP-MATRIX) 0 → 1 → 2 로 올리며 fps 를 본다. 6MB 다운로드도 팔마다 붙는다. -->
    <label>FR5 팔
      <select id="arms">
        <option value="0">0대 (빠름)</option>
        <option value="1">1대</option>
        <option value="2">2대</option>
      </select>
    </label>
    <label><input id="anim" type="checkbox"> 애니메이션 (팔마다 다른 동작)</label>
    <div>
      <button id="go" type="button" disabled>AR 시작</button>
      <button id="copy" type="button">결과 복사</button>
    </div>
    <div id="log"></div>
  </div>

  <!-- **오버레이 루트는 화면을 덮으면 안 된다.** 덮으면 탭을 DOM 이 먹어 XR `select` 가
       안 온다 (2026-08-04 실측 — 탭이 하나도 안 들어왔다). 그래서 크기 0 껍데기를 루트로
       주고, 안의 것들만 `position:fixed` 로 띄운다. 조작바는 `beforexrselect` 로
       그 위 탭만 DOM 이 가져가게 한다. -->
  <div id="ov">
    <div id="hud"></div>
    <div id="fps"></div>
    <div id="hint"></div>
    <div id="bar" hidden>
      <button id="zoomOut" type="button">축소</button>
      <button id="zoomIn" type="button">확대</button>
      <button id="rotL" type="button">↺</button>
      <button id="rotR" type="button">↻</button>
      <button id="again" type="button">다시 놓기</button>
    </div>
  </div>

  <script type="module" src="/src/screens/xr.js"></script>
</body>
</html>
